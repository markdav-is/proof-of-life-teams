apiVersion: apps/v1
kind: Deployment
metadata:
  name: proof-of-life-bot
  namespace: proof-of-life
  labels:
    app: proof-of-life-bot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: proof-of-life-bot
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: proof-of-life-bot
    spec:
      serviceAccountName: proof-of-life-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: bot
          image: __ACR_NAME__.azurecr.io/proof-of-life-bot:__IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: proof-of-life-bot-config
            - secretRef:
                name: proof-of-life-bot-secrets
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
