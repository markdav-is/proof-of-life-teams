apiVersion: v1
kind: ConfigMap
metadata:
  name: proof-of-life-config
  namespace: proof-of-life
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  # Tenant and client IDs (non-secret). Secrets live in the Secret object below.
  AzureAd__Instance: "https://login.microsoftonline.com/"
  AzureAd__TenantId: "__TENANT_ID__"
  AzureAd__ClientId: "__API_CLIENT_ID__"       # API app registration
  AzureAd__Audience: "api://__API_CLIENT_ID__"
  Graph__TenantId: "__TENANT_ID__"
  Graph__ClientId: "__API_CLIENT_ID__"
  PresencePolling__IntervalMinutes: "5"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: proof-of-life-web-config
  namespace: proof-of-life
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  AzureAd__Instance: "https://login.microsoftonline.com/"
  AzureAd__TenantId: "__TENANT_ID__"
  AzureAd__ClientId: "__WEB_CLIENT_ID__"        # Web app registration (separate)
  AzureAd__CallbackPath: "/signin-oidc"
  AzureAd__SignedOutCallbackPath: "/signout-oidc"
  MicrosoftGraph__BaseUrl: "https://graph.microsoft.com/v1.0"
  # Internal cluster service URL for the API
  ApiBaseUrl: "http://proof-of-life-api-svc"
