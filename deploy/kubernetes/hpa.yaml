apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: proof-of-life-api-hpa
  namespace: proof-of-life
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: proof-of-life-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# Note: Blazor Server uses sticky sessions, so we keep Web replicas low.
# Scale with care — each pod holds its own circuit state.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: proof-of-life-web-hpa
  namespace: proof-of-life
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: proof-of-life-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
