# ⚠️  TEMPLATE ONLY — do NOT commit real secrets.
# In production, populate via External Secrets Operator, Azure Key Vault CSI Driver,
# or `kubectl create secret generic` from a CI/CD pipeline.
#
# All values must be base64-encoded:  echo -n 'value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: proof-of-life-api-secrets
  namespace: proof-of-life
type: Opaque
data:
  # echo -n 'your-client-secret' | base64
  AzureAd__ClientSecret: "__BASE64_API_CLIENT_SECRET__"
  Graph__ClientSecret: "__BASE64_API_CLIENT_SECRET__"
  # echo -n 'your-strong-api-key' | base64
  ApiKey: "__BASE64_API_KEY__"
  # echo -n 'your-webhook-client-state-secret' | base64  (any random string, e.g. uuidgen)
  Webhook__ClientState: "__BASE64_WEBHOOK_CLIENT_STATE__"
---
apiVersion: v1
kind: Secret
metadata:
  name: proof-of-life-web-secrets
  namespace: proof-of-life
type: Opaque
data:
  AzureAd__ClientSecret: "__BASE64_WEB_CLIENT_SECRET__"
  # Must match the ApiKey in the api secrets above
  ApiKey: "__BASE64_API_KEY__"
